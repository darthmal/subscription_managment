spring.application.name=registration-platform

# ===================================================================
# JWT Configuration
# ===================================================================
# IMPORTANT: Replace with a strong, secure, Base64-encoded secret key!
# Generate using: openssl rand -base64 64
app.jwt.secret=VGhpcyBpcyBhIHZlcnkgc2VjdXJlIGFuZCBsb25nIGJhc2U2NCBlbmNvZGVkIHNlY3JldCBrZXkgZm9yIEpXVC4gUmVwbGFjZSBtZSE=

# Token validity duration (e.g., 1 hour = 3600000 ms)
app.jwt.expiration-ms=3600000

# ===================================================================
# Database Configuration (PostgreSQL)
# ===================================================================
# Replace with your actual PostgreSQL connection details
spring.datasource.url=jdbc:postgresql://localhost:5432/registration_db
spring.datasource.username=registration_user
spring.datasource.password=registration_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# 'update' attempts to update the schema based on entities (useful for development)
# For production, consider 'validate' or 'none' with a schema migration tool (Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true # Set to false in production

# ===================================================================
# OAuth2 Client Configuration (Example for Google)
# ===================================================================
# Replace with your actual Google Client ID and Secret
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Add similar properties for Microsoft if needed
# spring.security.oauth2.client.registration.microsoft...

# ===================================================================
# File Storage Configuration
# ===================================================================
# Base directory for storing uploaded documents (Ensure this directory exists and the application has write permissions)
# Use forward slashes even on Windows for consistency. Adjust the path as needed for your environment.
# Example for Windows: C:/uploads/registration-docs
# Example for Linux/macOS: /var/uploads/registration-docs
app.file-storage.upload-dir=./uploads/registration-docs

# Maximum file size allowed (e.g., 5MB = 5242880 bytes) - Corresponds to "max 5MB" requirement
# Spring Boot's default is 1MB, so we need to configure multipart properties as well.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# Email Configuration (Spring Mail)
# ===================================================================
# Replace with your actual SMTP server details
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-email-password

# Common Mail Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true # Use true for TLS
# spring.mail.properties.mail.smtp.ssl.enable=true # Use true for SSL (usually port 465)
spring.mail.properties.mail.transport.protocol=smtp
# Optional: Set a default 'from' address if needed
# spring.mail.default-encoding=UTF-8
# mail.from.address=noreply@example.com

# ===================================================================
# Default Admin User Configuration
# ===================================================================
# Email for the default admin user created on startup if it doesn't exist
app.admin.email=admin@example.com
# Password for the default admin user (CHANGE THIS IN PRODUCTION!)
app.admin.password=adminpassword
