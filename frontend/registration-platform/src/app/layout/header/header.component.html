<header class="bg-primary-700 text-white shadow-md">
  <div class="container mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center">
      <a routerLink="/" class="text-xl font-bold">Registration Platform</a>
    </div>
    
    <!-- Desktop Navigation -->
    <nav class="hidden md:flex space-x-6">
      <a routerLink="/" routerLinkActive="text-accent-300" [routerLinkActiveOptions]="{exact: true}" class="hover:text-accent-300 transition-colors">Home</a>
      <a routerLink="/applicant" routerLinkActive="text-accent-300" class="hover:text-accent-300 transition-colors">Application</a>
      <button (click)="logout()" class="hover:text-accent-300 transition-colors">Logout</button>
    </nav>
    
    <!-- Mobile Menu Button -->
    <button (click)="toggleMenu()" class="md:hidden text-white focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path *ngIf="!isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        <path *ngIf="isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  
  <!-- Mobile Navigation -->
  <div *ngIf="isMenuOpen" class="md:hidden bg-primary-800 py-2">
    <div class="container mx-auto px-4 flex flex-col space-y-2">
      <a routerLink="/" routerLinkActive="text-accent-300" [routerLinkActiveOptions]="{exact: true}" class="block py-2 hover:text-accent-300 transition-colors">Home</a>
      <a routerLink="/applicant" routerLinkActive="text-accent-300" class="block py-2 hover:text-accent-300 transition-colors">Application</a>
      <button (click)="logout()" class="block py-2 text-left hover:text-accent-300 transition-colors w-full">Logout</button>
    </div>
  </div>
</header>
